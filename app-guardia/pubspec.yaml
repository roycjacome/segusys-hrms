name: segusys_app
description: Segusys · App de control para guardias de seguridad privada
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking / Backend
  supabase_flutter: ^2.5.6
  http: ^1.2.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Geolocation + tamper detection
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  flutter_jailbreak_detection: ^1.10.0
  device_info_plus: ^10.1.2

  # Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # UI / utilities
  google_maps_flutter: ^2.7.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.0

  # Crash reporting
  sentry_flutter: ^8.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4
  patrol: ^3.11.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
